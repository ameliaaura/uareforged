name: Feature request
description: Propose a change or a new feature, ideally after talking it through in Discussions > Ideas.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Bigger features are agreed here **before** anyone writes the code (see CONTRIBUTING.md).
        UA Reforged stays a free, non-commercial remaster of the 1998 game: the Original preset never changes,
        and no Microsoft game files go into the repository.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Graphics / New Look
        - Gameplay
        - Controls / controllers
        - Install, downloads, launcher
        - VR (Quest)
        - Multiplayer
        - Building / CI / docs
        - Other
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: macOS
        - label: Windows
        - label: Meta Quest

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Who is it for, and what is hard or missing today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What do you propose?
      description: How it should work for the player. Mock-ups, screenshots or references to the 1998 game welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - Yes, I'd like to send a pull request
        - Maybe, with some guidance
        - No, just suggesting it
    validations:
      required: true
