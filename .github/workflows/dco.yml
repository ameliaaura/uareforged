# Developer Certificate of Origin: every commit in a pull request needs a
# "Signed-off-by: Name <email>" line that matches its author (git commit -s).
# See CONTRIBUTING.md#sign-off-dco. Dependabot pull requests are exempt.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Dependabot's commits are made by GitHub's bot and cannot carry a sign-off,
      # so its pull requests are exempt. The job still runs (and passes), so the
      # required "DCO sign-off" check is reported on them.
      - name: Skip bot pull requests
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Sign-off is not required on Dependabot pull requests."

      - name: Check every commit
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "ok      $(git log -1 --format='%h %s' "$c")"
            else
              echo "MISSING $(git log -1 --format='%h %s' "$c")  (expected: Signed-off-by: $author)"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo
            echo "Some commits are not signed off. Fix them with:"
            echo "  git rebase --signoff ${BASE:0:12}   # then: git push --force-with-lease"
            echo "See CONTRIBUTING.md (Sign-off) for why."
            exit 1
          fi
